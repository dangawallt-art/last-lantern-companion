<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <title>The Last Lantern</title>

  <!-- PWA / mobile install -->
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <meta name="apple-mobile-web-app-title" content="Last Lantern"/>
  <meta name="theme-color" content="#090b12"/>
  <link rel="manifest" href="manifest.json"/>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700;900&display=swap" rel="stylesheet"/>

  <!-- React 18 + Babel standalone (no build step needed) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;background:#090b12;overflow-x:hidden;}
    #root{min-height:100%;}

    @keyframes floatUp{
      0%  {transform:translate(0,0) scale(1);opacity:0;}
      12% {opacity:var(--op,0.7);}
      88% {opacity:calc(var(--op,0.7)*0.3);}
      100%{transform:translate(var(--dx,0px),var(--dy,-90px)) scale(0.5);opacity:0;}
    }
    @keyframes emberRise{
      0%  {transform:translate(0,0) scale(1);opacity:0;}
      15% {opacity:0.95;}
      80% {opacity:0.4;}
      100%{transform:translate(var(--ex,8px),-110px) scale(0.3);opacity:0;}
    }
    @keyframes flameDance{
      0%,100%{transform:scaleX(1)   scaleY(1)   translateY(0);}
      25%    {transform:scaleX(1.2) scaleY(0.9) translateY(2px);}
      50%    {transform:scaleX(0.85)scaleY(1.1) translateY(-3px);}
      75%    {transform:scaleX(1.1) scaleY(0.95)translateY(1px);}
    }
    @keyframes sp1{0%,100%{box-shadow:inset 0 0 35px rgba(210,40,40,.10);}50%{box-shadow:inset 0 0 70px  rgba(210,40,40,.20);}}
    @keyframes sp2{0%,100%{box-shadow:inset 0 0 50px rgba(220,40,40,.18);}50%{box-shadow:inset 0 0 100px rgba(220,40,40,.36);}}
    @keyframes sp3{0%,100%{box-shadow:inset 0 0 60px rgba(230,40,40,.28);}50%{box-shadow:inset 0 0 120px rgba(230,40,40,.52);}}
    @keyframes sp4{
      0%,100%{box-shadow:inset 0 0 70px rgba(255,30,30,.40),inset 0 0 20px rgba(255,80,80,.20);}
      50%    {box-shadow:inset 0 0 140px rgba(255,30,30,.65),inset 0 0 40px rgba(255,80,80,.30);}
    }
    @keyframes fadeIn {from{opacity:0;transform:scale(0.96);}to{opacity:1;transform:scale(1);}}
    @keyframes slideIn{from{opacity:0;transform:translateX(50px);}to{opacity:1;transform:translateX(0);}}

    .fade-in {animation:fadeIn  0.35s ease-out both;}
    .slide-in{animation:slideIn 0.30s ease-out both;}
    .sp1{animation:sp1 3.0s ease-in-out infinite;}
    .sp2{animation:sp2 2.0s ease-in-out infinite;}
    .sp3{animation:sp3 1.5s ease-in-out infinite;}
    .sp4{animation:sp4 0.8s ease-in-out infinite;}
  </style>
</head>
<body>

// ── PRIMITIVES ───────────────────────────────────────────────────────────────
const TS=(x={})=>({cursor:"pointer",border:"none",outline:"none",fontFamily:"inherit",touchAction:"manipulation",WebkitTapHighlightColor:"transparent",...x});
function AdjBtn({onClick,children,size=44,col=TXT}){
  return <button onClick={onClick} style={TS({width:size,height:size,borderRadius:8,background:SURF,border:`1px solid ${BORD}`,color:col,fontSize:size>36?20:14,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0})}>{children}</button>;
}
function Bar({v,max,col,h=8}){
  const p=max>0?Math.max(0,Math.min(1,v/max)):0;
  return <div style={{flex:1,height:h,background:BORD,borderRadius:4,overflow:"hidden"}}><div style={{width:`${p*100}%`,height:"100%",background:`linear-gradient(90deg,${col}88,${col})`,borderRadius:4,transition:"width 0.15s ease"}}/></div>;
}
function Pips({n,filled,col,size=15}){
  return <div style={{display:"flex",gap:3}}>{Array.from({length:n}).map((_,i)=><div key={i} style={{width:size,height:size,borderRadius:3,background:i<filled?col:"transparent",border:`1.5px solid ${i<filled?col:BORD}`,transition:"background 0.1s"}}/>)}</div>;
}

// ── LANTERN SVG ──────────────────────────────────────────────────────────────
function LanternSVG(){
  return(

      <defs>

        <radialGradient id="fg" cx="50%" cy="0%"><stop offset="0%" stopColor="#f09020" stopOpacity="0.7"/><stop offset="100%" stopColor="#f09020" stopOpacity="0"/></radialGradient>
      </defs>
      {/* Ring */}
      <ellipse cx="60" cy="15" rx="16" ry="11" fill="none" stroke="#b09040" strokeWidth="3.5"/>
      <rect x="55" y="15" width="10" height="16" fill="#9a7830"/>
      {/* Cap */}
      <polygon points="28,31 92,31 98,48 22,48" fill="#7a6028"/>
      {[40,55,65,80].map((x,i)=><polygon key={i} points={`${x-5},31 ${x},17 ${x+5},31`} fill="#c89a3a"/>)}

      <rect x="24" y="48" width="72" height="148" rx="3" fill="url(#ig)" opacity="0.92">
        <animate attributeName="opacity" values="0.92;1;0.88;0.96;0.92" dur="0.9s" repeatCount="indefinite"/>
      </rect>
      {/* Iron verticals */}
      {[24,43,60,77,96].map((x,i)=><line key={i} x1={x} y1="48" x2={x} y2="196" stroke="#9a7830" strokeWidth={i===0||i===4?4:2}/>)}

      {[90,130,170].map((y,i)=><line key={i} x1="24" y1={y} x2="96" y2={y} stroke="#9a7830" strokeWidth="2.5"/>)}
      {/* Gothic arch tops */}
      <path d="M43,48 Q60,68 77,48" fill="none" stroke="#9a7830" strokeWidth="2"/>
      <path d="M24,48 Q34,64 43,48" fill="none" stroke="#9a7830" strokeWidth="1.5"/>
      <path d="M77,48 Q87,64 96,48" fill="none" stroke="#9a7830" strokeWidth="1.5"/>

      <path d="M60,108 l3,9 7-3-5,7 9,3-9,2 3,9-8-6-8,6 3-9-9-2 9-3-5-7 7,3Z" fill="#ffd060">
        <animate attributeName="opacity" values="0.7;1;0.55;0.88;0.7" dur="1.3s" repeatCount="indefinite"/>
      </path>
      {/* Outer flame */}
      <ellipse cx="60" cy="147" rx="14" ry="18" fill="#ff8018" opacity="0.85" style={{transformOrigin:"60px 147px",animation:"flameDance 0.35s ease-in-out infinite"}}/>
      {/* Inner bright core */}
      <ellipse cx="60" cy="145" rx="7" ry="11" fill="#fff4a0" opacity="0.9" style={{transformOrigin:"60px 145px",animation:"flameDance 0.28s ease-in-out infinite"}}/>

      <rect x="20" y="196" width="80" height="13" rx="3" fill="#7a6028"/>
      <rect x="15" y="209" width="90" height="7" rx="2" fill="#6a5020"/>
      {/* Floor glow */}
      <ellipse cx="60" cy="228" rx="55" ry="12" fill="url(#fg)">
        <animate attributeName="opacity" values="0.8;1;0.6;0.85;0.8" dur="0.75s" repeatCount="indefinite"/>
        <animate attributeName="rx" values="55;65;50;60;55" dur="0.9s" repeatCount="indefinite"/>
      </ellipse>
    </svg>
  );
}

// ── 3D DICE MODAL ────────────────────────────────────────────────────────────
const DOTS={1:[[50,50]],2:[[27,27],[73,73]],3:[[27,27],[50,50],[73,73]],4:[[27,27],[73,27],[27,73],[73,73]],5:[[27,27],[73,27],[50,50],[27,73],[73,73]],6:[[27,27],[73,27],[27,50],[73,50],[27,73],[73,73]]};
const FACE_T={"1":"translateZ(45px)","6":"rotateY(180deg) translateZ(45px)","2":"rotateY(90deg) translateZ(45px)","5":"rotateY(-90deg) translateZ(45px)","3":"rotateX(-90deg) translateZ(45px)","4":"rotateX(90deg) translateZ(45px)"};
// Container rotation to show face: 1→(0,0), 6→(0,180), 2→(0,-90), 5→(0,90), 3→(90,0), 4→(-90,0)
const FACE_ROT={1:[0,0],2:[0,-90],3:[90,0],4:[-90,0],5:[0,90],6:[0,180]};
function DiceModal({onDismiss,onResult}){
  const cubeRef=useRef(null);
  const [done,setDone]=useState(false);
  const [res,setRes]=useState(null);
  useEffect(()=>{
    const result=Math.floor(Math.random()*6)+1;
    const [fr,fy]=FACE_ROT[result];
    const spins=3;
    const tX=fr+360*spins, tY=fy+360*spins;
    const t0=Date.now(), dur=1400;
    let raf;
    function frame(){
      const t=Math.min((Date.now()-t0)/dur,1);
      const ease=1-Math.pow(1-t,3);
      if(cubeRef.current) cubeRef.current.style.transform=`rotateX(${ease*tX}deg) rotateY(${ease*tY}deg)`;
      if(t<1){raf=requestAnimationFrame(frame);}
      else{setDone(true);setRes(result);onResult(result);}
    }
    raf=requestAnimationFrame(frame);
    return()=>cancelAnimationFrame(raf);
  },[]);
  return(
    <div onClick={onDismiss} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.82)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",zIndex:100,gap:20}}>
      <div style={{perspective:"500px"}}>
        <div ref={cubeRef} style={{width:90,height:90,position:"relative",transformStyle:"preserve-3d",transform:"rotateX(0deg) rotateY(0deg)"}}>
          {[1,2,3,4,5,6].map(f=>(
            <div key={f} style={{position:"absolute",width:90,height:90,transform:FACE_T[f],background:"#f5eed8",borderRadius:14,border:"3px solid #a08040",backfaceVisibility:"hidden",boxShadow:"inset 0 0 12px rgba(0,0,0,0.12)",display:"flex",alignItems:"center",justifyContent:"center"}}>
              <div style={{position:"relative",width:"100%",height:"100%"}}>
                {DOTS[f].map(([x,y],i)=><div key={i} style={{position:"absolute",width:14,height:14,borderRadius:"50%",background:"#1a1200",left:`${x}%`,top:`${y}%`,transform:"translate(-50%,-50%)"}}/>)}
              </div>
            </div>
          ))}
        </div>
      </div>
      {done&&res&&(
        <div style={{fontSize:36,fontWeight:900,fontFamily:"'Cinzel Decorative',serif",color:res<=2?"#d44040":res>=5?"#2db86a":"#c8a951",animation:"fadeIn 0.3s ease-out both"}}>{res}</div>
      )}
      <div style={{fontSize:11,color:MUT,letterSpacing:1}}>tap to dismiss</div>
    </div>
  );
}

            <div style={{marginBottom:16}}>
              <div style={{fontSize:10,color:MUT,letterSpacing:1.5,marginBottom:8}}>NAME (optional)</div>
              <input value={newName} onChange={e=>onSetName(e.target.value)} placeholder={`${ET[newType].l} ${nextId}`} style={{width:"100%",background:SURF,border:`1px solid ${BORD}`,borderRadius:8,padding:"12px 14px",color:TXT,fontSize:14,fontFamily:"inherit",outline:"none"}}/>
            </div>
            <div style={{marginBottom:20,fontSize:12,color:MUT}}>Starting HP: <span style={{color:TXT,fontWeight:700}}>{ET[newType].defHp}</span> · Max: <span style={{color:TXT,fontWeight:700}}>{ET[newType].maxHp}</span></div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={onHideAdd} style={TS({flex:1,padding:"14px 0",background:SURF,border:`1px solid ${BORD}`,borderRadius:10,color:MUT,fontSize:13,fontWeight:700})}>Cancel</button>
              <button onClick={onAdd} style={TS({flex:2,padding:"14px 0",background:"rgba(45,184,106,0.12)",border:"1px solid rgba(45,184,106,0.4)",borderRadius:10,color:"#2db86a",fontSize:13,fontWeight:700})}>Add to Encounter</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){
  const [screen,setScreen]=useState("home");
  const [charId,setCharId]=useState(null);
  const [hp,setHp]=useState(0);
  const [en,setEn]=useState(0);
  const [stress,setStress]=useState(0);
  const [expanded,setExpanded]=useState(null);
  const [missionMode,setMissionMode]=useState(null);
  const [enemies,setEnemies]=useState([]);
  const [showAdd,setShowAdd]=useState(false);
  const [newType,setNewType]=useState("grunt");
  const [newName,setNewName]=useState("");
  const [eid,setEid]=useState(1);

  const char=charId?CH[charId]:null;

  function pickChar(id){
    const c=CH[id];
    setCharId(id);setHp(c.hp);setEn(c.en);setStress(0);
    setExpanded(null);setMissionMode(null);
    setScreen("player");
  }
  function addEnemy(){
    const et=ET[newType];
    const name=newName.trim()||`${et.l} ${eid}`;
    setEnemies(prev=>[...prev,{id:eid,name,type:newType,hp:et.defHp,maxHp:et.defHp}]);
    setEid(i=>i+1);setNewName("");setShowAdd(false);
  }
  function adjustEHP(id,d){
    setEnemies(prev=>prev.map(e=>e.id===id?{...e,hp:Math.max(0,Math.min(e.maxHp,e.hp+d))}:e));
  }

  const root={fontFamily:"system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif",background:BG,color:TXT,minHeight:"100vh",maxWidth:480,margin:"0 auto"};

  return(
    <div style={root} className="fade-in">
      {screen==="home"&&<HomeScreen onPlayer={()=>setScreen("char-select")} onLeader={()=>{setEnemies([]);setShowAdd(false);setScreen("leader");}}/>}
      {screen==="char-select"&&<CharSelectScreen onBack={()=>setScreen("home")} onSelect={pickChar}/>}
      {screen==="player"&&char&&(
        <PlayerScreen char={char} hp={hp} en={en} stress={stress} expanded={expanded} missionMode={missionMode}
          onHp={d=>setHp(h=>Math.max(0,Math.min(char.hp,h+d)))}
          onEn={d=>setEn(e=>Math.max(0,Math.min(char.en,e+d)))}
          onStress={d=>setStress(s=>Math.max(0,Math.min(5,s+d)))}
          onExpand={i=>setExpanded(prev=>prev===i?null:i)}
          onMission={setMissionMode}
          onBack={()=>setScreen("char-select")}/>
      )}
      {screen==="leader"&&(
        <LeaderScreen enemies={enemies} showAdd={showAdd} newType={newType} newName={newName} nextId={eid}
          onShowAdd={()=>setShowAdd(true)} onHideAdd={()=>setShowAdd(false)}
          onSetType={setNewType} onSetName={setNewName} onAdd={addEnemy}
          onRemove={id=>setEnemies(prev=>prev.filter(e=>e.id!==id))}
          onAdjust={adjustEHP} onBack={()=>setScreen("home")}/>
      )}
    </div>
  );
}


    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
